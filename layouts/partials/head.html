<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}{{ if .IsHome }} | South Puget Sound{{ end }}</title>
<meta name="description" content="{{ .Site.Params.description }}">
<meta name="theme-color" content="#234d3c">
<link rel="icon" href="{{ "favicon-32x32.png" | relURL }}" type="image/png">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ .Site.Title }} | South Puget Sound">
<meta property="og:description" content="{{ .Site.Params.description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ "images/home.jpg" | absURL }}">
<meta property="og:image:alt" content="A tidy living room with soft sofas and wood floors">
{{ $css := resources.Get "css/site.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
